<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>MotoriGo — Plataforma de servicios</title>

<!-- Supabase: browser client. La clave usada aquí es la ANON/PUBLISHABLE, nunca service_role. -->

<!-- Face recognition, open source. Los modelos se cargan desde CDN. -->
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#142033;--muted:#65748b;--brand:#ffcf00;--brand2:#f5b900;--dark:#0b1220;--ok:#19a974;--danger:#dc3545;--line:#e5eaf1;--shadow:0 10px 30px rgba(11,18,32,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.app{min-height:100vh}
.top{height:64px;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:20}
.logo{font-weight:900;letter-spacing:.4px}.logo span{color:var(--brand)}
.top-actions{display:flex;gap:8px;align-items:center}.pill{padding:7px 10px;border-radius:999px;background:#1d2a40;font-size:12px}
.layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 64px)}
.side{background:#10192a;color:#dbe5f5;padding:14px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}
.nav{display:grid;gap:7px}.nav button{background:transparent;color:#dbe5f5;text-align:left;padding:12px;border-radius:10px}.nav button:hover,.nav button.active{background:#1d2a40;color:#fff}
.main{padding:22px;max-width:1500px;width:100%;margin:auto}.page-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
h1,h2,h3{margin:0 0 8px}.muted{color:var(--muted)}.small{font-size:12px}.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:var(--shadow)}
.stat{font-size:27px;font-weight:900}.tag{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eef2f7;font-size:12px;margin:2px}.tag.ok{background:#dff8ed;color:#087a50}.tag.busy{background:#fff0d6;color:#9a5d00}.tag.red{background:#ffe3e6;color:#a51f2c}
.btn{padding:10px 13px;border-radius:10px;background:#e9eef5;color:var(--ink);font-weight:700}.btn.primary{background:var(--brand);color:#111}.btn.dark{background:var(--dark);color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.danger{background:var(--danger);color:#fff}.btn.small{padding:7px 9px;font-size:12px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d9e0ea;border-radius:10px;background:#fff;outline:none}input:focus,select:focus,textarea:focus{border-color:#9aabc3;box-shadow:0 0 0 3px rgba(154,171,195,.15)}
label{display:block;font-size:12px;font-weight:800;margin:0 0 6px}.field{margin-bottom:12px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:13px}
.banner{border-radius:16px;padding:17px;background:linear-gradient(135deg,#111c2e,#233652);color:#fff}.banner.yellow{background:linear-gradient(135deg,#f5b900,#ffe26a);color:#111}
.map{height:260px;border-radius:14px;background:#dfe7f0;display:grid;place-items:center;color:#53667f;overflow:hidden}.map iframe{width:100%;height:100%;border:0}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#263d61,#0b1220 60%);color:#fff}.login-card{width:min(460px,100%);background:#fff;color:var(--ink);border-radius:22px;padding:25px;box-shadow:0 25px 80px rgba(0,0,0,.3)}.role-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}.role-tabs button{padding:10px;border-radius:9px;background:#eef2f7}.role-tabs button.sel{background:var(--brand)}
.kpi{display:flex;justify-content:space-between;align-items:flex-start}.switch{width:64px;height:34px;border-radius:20px;background:#8995a6;padding:4px}.switch i{display:block;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}.switch.on{background:var(--ok)}.switch.on i{transform:translateX(30px)}
.modal{position:fixed;inset:0;background:rgba(4,10,20,.7);display:grid;place-items:center;z-index:100;padding:18px}.modal-card{background:#fff;color:var(--ink);border-radius:18px;padding:20px;width:min(720px,100%);max-height:92vh;overflow:auto}
#toast{position:fixed;right:16px;bottom:16px;z-index:200;display:grid;gap:8px}.toast{background:#10192a;color:#fff;padding:12px 14px;border-radius:10px;box-shadow:var(--shadow)}
.chat{display:grid;grid-template-rows:1fr auto;height:330px}.messages{overflow:auto;padding:8px;background:#f7f9fc;border-radius:12px}.msg{max-width:78%;padding:9px 11px;border-radius:12px;margin:5px 0;background:#e9eef5}.msg.me{margin-left:auto;background:#dff8ed}.photo{width:54px;height:54px;border-radius:50%;object-fit:cover;background:#e8edf4}.qr{width:210px;height:210px;display:block;margin:auto}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:fixed;bottom:0;top:auto;width:100%;height:auto;z-index:30;padding:6px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.main{padding-bottom:90px}.g4,.g3,.g2{grid-template-columns:1fr}.top{position:sticky}}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="login-card">
    <div style="font-size:28px;font-weight:900">Motori<span style="color:#f5b900">Go</span></div>
    <div class="muted">Conductores · Clientes · Administración</div>
    <div class="role-tabs">
      <button data-role="driver" class="sel">Conductor</button>
      <button data-role="client">Cliente</button>
      <button data-role="admin">Admin</button>
    </div>
    <form id="loginForm">
      <div class="field"><label id="loginUserLabel">Usuario / celular</label><input id="loginUser" required autocomplete="username"></div>
      <div class="field"><label>Contraseña</label><input id="loginPass" required inputmode="numeric" maxlength="12" type="password" autocomplete="current-password"></div>
      <button class="btn primary" style="width:100%">Ingresar</button>
    </form>
    <div class="row" style="justify-content:space-between;margin-top:12px">
      <button class="btn small" onclick="recoverPassword()">Recuperar contraseña</button>
      <button class="btn small" onclick="registerClient()">Nuevo cliente</button>
    </div>
    <div class="card" style="margin-top:15px;background:#f7f9fc">
      <b>Demo inicial</b>
      <div class="small muted">Admin: usuario <b>admin</b> · contraseña <b>12</b>. Para producción, cambia estas credenciales y configura RLS.</div>
    </div>
  </div>
</div>

<div id="app" class="app hidden">
<header class="top">
  <div class="logo">Motori<span>Go</span></div>
  <div class="top-actions"><span id="rolePill" class="pill"></span><span id="userPill" class="pill"></span><button class="btn small" onclick="logout()">Salir</button></div>
</header>
<div class="layout">
<aside class="side"><div class="nav" id="nav"></div></aside>
<main class="main" id="main"></main>
</div>
</div>

<div id="modal" class="modal hidden"><div class="modal-card" id="modalBody"></div></div>
<div id="toast"></div>

<script>
/* =========================
   CONFIGURACIÓN
   ========================= */
const SUPABASE_URL = "https://njvzlgcsizroyzfojlus.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5qdnpsZ2NzaXpyb3l6Zm9qbHVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NzMxNiwiZXhwIjoyMTAzMzUzMzE2fQ.b6aArILZS_aFHgri450Wh0bFH52J5kY3y3cLvUxRAag";
let sb=null;
try{ sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}); }catch(e){console.warn(e)}

const MODEL_URL="https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights";
const LS="motorigo_state_v1";
const SESSION="motorigo_session_v1";
let state=JSON.parse(localStorage.getItem(LS)||"null")||{
  drivers:[],clients:[],services:[],fares:[
    {neighborhood:"Centro",category:"personas",price:7000},
    {neighborhood:"Chapinero",category:"personas",price:9000},
    {neighborhood:"Teusaquillo",category:"personas",price:8500},
    {neighborhood:"Usaquen",category:"personas",price:12000},
    {neighborhood:"Centro",category:"documentos",price:6000},
    {neighborhood:"Centro",category:"restaurante",price:6500}
  ],categories:["personas","documentos","restaurante"],chats:[],admin:{user:"admin",pass:"12"}
};
let session=JSON.parse(localStorage.getItem(SESSION)||"null");
let currentRole="driver", currentPage="home", geoWatch=null, faceReady=false;

function save(){localStorage.setItem(LS,JSON.stringify(state))}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function id(){return Math.random().toString(36).slice(2,10)}
function money(n){return new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(Number(n)||0)}
function toast(msg){const e=document.createElement("div");e.className="toast";e.textContent=msg;document.getElementById("toast").appendChild(e);setTimeout(()=>e.remove(),3500)}
function modal(html){document.getElementById("modalBody").innerHTML=html;document.getElementById("modal").classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
function rand3(){return String(Math.floor(100+Math.random()*900))}
function rand4(){return String(Math.floor(1000+Math.random()*9000))}
function user(){
  if(!session)return {};
  if(session.role==="driver") return state.drivers.find(x=>x.id===session.id)||session.record||{};
  if(session.role==="client") return state.clients.find(x=>x.id===session.id)||session.record||{};
  return session.record||{};
}
function role(){return session?.role}

async function db(table, action, payload, filter){
  if(!sb)return {data:null,error:new Error("Supabase no disponible")};
  try{
    let q=sb.from(table);
    if(action==="select"){q=q.select("*"); if(filter)q=q.eq(filter[0],filter[1]); return await q;}
    if(action==="insert")return await q.insert(payload).select();
    if(action==="update"){q=q.update(payload); if(filter)q=q.eq(filter[0],filter[1]); return await q.select();}
    if(action==="delete"){q=q.delete(); if(filter)q=q.eq(filter[0],filter[1]); return await q;}
  }catch(error){return {data:null,error}}
}
async function sync(table, rows){ if(!rows?.length)return; try{await sb.from(table).upsert(rows,{onConflict:"id"});}catch(e){console.info("Sincronización opcional:",table,e.message)} }

/* =========================
   LOGIN
   ========================= */
document.querySelectorAll(".role-tabs button").forEach(b=>b.onclick=()=>{
  currentRole=b.dataset.role;
  document.querySelectorAll(".role-tabs button").forEach(x=>x.classList.toggle("sel",x===b));
  document.getElementById("loginUserLabel").textContent=currentRole==="client"?"Documento o correo":currentRole==="admin"?"Usuario admin":"Usuario / celular";
});
document.getElementById("loginForm").onsubmit=async e=>{
 e.preventDefault();
 const u=document.getElementById("loginUser").value.trim(), p=document.getElementById("loginPass").value.trim();
 let rec=null;
 if(currentRole==="admin"){if(u===state.admin.user&&p===state.admin.pass)rec={...state.admin,name:"Administrador"}}
 if(currentRole==="driver")rec=state.drivers.find(x=>(x.username===u||x.phone===u)&&x.password===p);
 if(currentRole==="client")rec=state.clients.find(x=>(x.document===u||x.email===u)&&x.password===p);
 if(!rec){toast("Usuario o contraseña incorrectos");return}
 session={role:currentRole,record:rec,id:rec.id||"admin"};
 localStorage.setItem(SESSION,JSON.stringify(session));
 openApp();
 if(currentRole==="driver")startDriverGPS();
};
function openApp(){
 document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");
 document.getElementById("rolePill").textContent=role();document.getElementById("userPill").textContent=user().name||user().user||user().username||"usuario";
 buildNav();render();
 if(role()==="driver")checkDailyFace();
}
function logout(){stopGPS();session=null;localStorage.removeItem(SESSION);location.reload()}

function buildNav(){
 const common=[["home","Inicio"],["services","Servicios"],["fares","Tarifas"],["chat","Chat admin"],["profile","Perfil"],["history","Historial"]];
 const admin=[["dashboard","Dashboard"],["drivers","Conductores"],["clients","Clientes"],["servicesAdmin","Activar servicios"],["faresAdmin","Tarifas"],["chats","Chats"]];
 const arr=role()==="admin"?admin:common;
 document.getElementById("nav").innerHTML=arr.map(([p,t])=>`<button class="${currentPage===p?"active":""}" onclick="go('${p}')">${t}</button>`).join("");
}
function go(p){currentPage=p;buildNav();render()}

function render(){
 const m=document.getElementById("main");
 if(role()==="admin"){renderAdmin(m);return}
 if(role()==="driver")renderDriver(m);else renderClient(m);
}

/* =========================
   CONDUCTOR
   ========================= */
function renderDriver(m){
 const d=user();const active=state.services.find(s=>s.driverId===d.id&&["accepted","in_progress"].includes(s.status));
 if(currentPage==="home"){
  const assigned=state.services.filter(s=>s.driverId===d.id&&["assigned","accepted"].includes(s.status));
  m.innerHTML=`<div class="page-title"><div><h1>Hola, ${esc(d.name||"conductor")}</h1><div class="muted">Panel de conductor / mototaxi</div></div>
  <div class="row"><button class="btn" onclick="enableNotifications()">🔔 Activar alertas</button><button class="btn ${d.online?"ok":"dark"}" onclick="toggleOnline()">${d.online?"● ACTIVO":"○ OCUPADO / INACTIVO"}</button></div></div>
  <div class="grid g4">
   <div class="card kpi"><div><div class="muted small">Estado</div><div class="stat">${d.online?"Activo":"Inactivo"}</div></div><span class="tag ${d.online?"ok":"red"}">${d.online?"Disponible":"No disponible"}</span></div>
   <div class="card"><div class="muted small">Servicios activos</div><div class="stat">${assigned.length}</div></div>
   <div class="card"><div class="muted small">Viajes realizados</div><div class="stat">${state.services.filter(s=>s.driverId===d.id&&s.status==="completed").length}</div></div>
   <div class="card"><div class="muted small">Ubicación GPS</div><div class="stat">${d.lat?"OK":"—"}</div></div>
  </div>
  <div class="card" style="margin-top:16px"><div class="page-title"><h2>Crear servicio individual</h2></div>
   <form onsubmit="createDriverService(event)" class="grid g3">
    <div class="field"><label>Categoría</label><select name="category">${state.categories.map(c=>`<option>${esc(c)}</option>`).join("")}</select></div>
    <div class="field"><label>Nombre / cliente / restaurante</label><input name="customer" required></div>
    <div class="field"><label>Precio</label><input name="price" type="number" min="0" required></div>
    <div class="field"><label>Barrio recogida</label><input name="pickupNeighborhood" required></div>
    <div class="field"><label>Dirección recogida</label><input name="pickupAddress" required></div>
    <div class="field"><label>Barrio llegada</label><input name="dropNeighborhood"></div>
    <div class="field"><label>Dirección llegada</label><input name="dropAddress"></div>
    <div class="field"><label>Propina</label><input name="tip" type="number" min="0" value="0"></div>
    <div class="field"><label>Parámetros adicionales</label><input name="notes"></div>
    <div><button class="btn primary">Crear servicio</button></div>
   </form>
  </div>
  <div class="card" style="margin-top:16px"><h2>Servicios disponibles / asignados</h2>${assigned.length?assigned.map(serviceCard).join(""):`<div class="muted">No tienes servicios asignados.</div>`}</div>`;
  return;
 }
 if(currentPage==="services"){
   const rows=state.services.filter(s=>s.driverId===d.id&&!["completed","cancelled"].includes(s.status));
   m.innerHTML=`<div class="page-title"><h1>Servicios</h1><span class="tag">${rows.length} abiertos</span></div>${rows.length?rows.map(serviceCard).join(""):`<div class="card muted">No hay servicios.</div>`}`;
   return;
 }
 if(currentPage==="fares"){m.innerHTML=`<div class="page-title"><h1>Tarifas</h1></div><div class="card"><input placeholder="Filtrar por barrio..." oninput="filterFares(this.value)"><div id="fareList" style="margin-top:12px">${fareRows().join("")}</div></div>`;return}
 if(currentPage==="chat"){m.innerHTML=chatPanel("admin",d.id);return}
 if(currentPage==="profile"){
  m.innerHTML=`<div class="page-title"><h1>Mi perfil</h1></div><div class="grid g2">
  <div class="card"><h2>Datos</h2><div class="grid g2">${["name","phone","plate","model","bikeType","document"].map(k=>`<div><div class="muted small">${k}</div><b>${esc(d[k]||"—")}</b></div>`).join("")}</div>
  <hr><h3>QR de pagos</h3><input id="payQr" type="url" value="${esc(d.paymentQr||"")}" placeholder="URL de QR / billetera"><button class="btn primary" style="margin-top:8px" onclick="savePayQR()">Guardar</button></div>
  <div class="card"><h2>QR de identificación</h2><canvas id="driverQR" class="qr"></canvas><div class="muted small" style="text-align:center">El cliente puede escanearlo para identificar este perfil.</div><div class="row" style="justify-content:center;margin-top:10px"><b>Código alterno:</b> ${esc(d.profileCode||"—")}</div></div>
  </div>`;setTimeout(()=>drawQR("driverQR",JSON.stringify({type:"driver",id:d.id,name:d.name,code:d.profileCode})),20);return}
 if(currentPage==="history"){
  const rows=state.services.filter(s=>s.driverId===d.id&&s.status==="completed");
  m.innerHTML=`<div class="page-title"><h1>Historial</h1></div><div class="card table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Categoría</th><th>Cliente</th><th>Valor</th><th>Pago</th></tr></thead><tbody>${rows.map(s=>`<tr><td>${new Date(s.completedAt||s.createdAt).toLocaleString()}</td><td>${esc(s.category)}</td><td>${esc(s.customerName||"")}</td><td>${money(s.total)}</td><td>${esc(s.paymentMethod||"—")}</td></tr>`).join("")||`<tr><td colspan="5">Sin viajes</td></tr>`}</tbody></table></div>`;return}
}
function serviceCard(s){
 const isRestaurant=s.category==="restaurante";
 return `<div class="banner ${s.status==="in_progress"?"yellow":""}" style="margin:10px 0">
 <div class="page-title"><div><span class="tag">${esc(s.category)}</span><h3>${esc(s.customerName||s.customer||"Cliente")}</h3><div>${esc(s.pickupNeighborhood||"")} · ${esc(s.pickupAddress||"")}</div></div><b>${money(s.total||s.price)}</b></div>
 <div class="grid g2"><div><div>Destino: ${esc(s.dropNeighborhood||"")} · ${esc(s.dropAddress||"")}</div><div>Propina: ${money(s.tip)}</div><div>Estado: <b>${esc(s.status)}</b></div></div>
 <div class="row" style="justify-content:flex-end"><button class="btn primary" onclick="acceptService('${s.id}')">Aceptar</button><button class="btn" onclick="openService('${s.id}')">Ver / chat</button></div></div>
 ${isRestaurant?`<div style="margin-top:10px"><input id="delivery-${s.id}" type="file" accept="image/*"><button class="btn small" onclick="attachDelivery('${s.id}')">Adjuntar foto entrega</button></div>`:""}</div>`;
}
function acceptService(idv){
 const s=state.services.find(x=>x.id===idv);if(!s)return;
 s.status="in_progress";s.acceptedAt=new Date().toISOString();s.code=rand3();s.driverId=user().id;user().online=false;save();toast("Servicio aceptado. Código de validación: "+s.code);playAlert(true);render();
}
function openService(idv){
 const s=state.services.find(x=>x.id===idv);if(!s)return;
 modal(`<h2>Servicio #${esc(s.id)}</h2><div class="grid g2">
 <div><b>Categoría:</b> ${esc(s.category)}<br><b>Cliente:</b> ${esc(s.customerName)}<br><b>Recogida:</b> ${esc(s.pickupAddress)}<br><b>Llegada:</b> ${esc(s.dropAddress)}<br><b>Total:</b> ${money(s.total)}</div>
 <div><b>Código de validación:</b><div class="stat">${esc(s.code||"—")}</div><div class="map" id="serviceMap">GPS del conductor y cliente en tiempo real</div></div></div>
 <hr><h3>Chat privado</h3>${chatPanel("service",s.id)}
 <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn danger" onclick="finishService('${s.id}',false)">Terminar servicio</button><button class="btn ok" onclick="finishService('${s.id}',true)">Terminar y confirmar pago</button><button class="btn" onclick="closeModal()">Cerrar</button></div>`);
}
function finishService(idv,askPay){
 const s=state.services.find(x=>x.id===idv);if(!s)return;
 if(askPay){modal(`<h2>Confirmar servicio</h2><p>Elige el medio de pago recibido. Esta confirmación no realiza ningún cobro.</p><div class="row">${["Efectivo","Nequi","Daviplata","Transferencia","Otro"].map(p=>`<button class="btn primary" onclick="completeService('${s.id}','${p}')">${p}</button>`).join("")}</div>`)}
 else completeService(s.id,"No cobrado");
}
function completeService(idv,payment){const s=state.services.find(x=>x.id===idv);s.status="completed";s.paymentMethod=payment;s.completedAt=new Date().toISOString();user().online=true;save();closeModal();toast("Servicio terminado");render()}
function createDriverService(e){
 e.preventDefault();const f=new FormData(e.target);const s={id:id(),driverId:user().id,customerName:f.get("customer"),category:f.get("category"),price:+f.get("price"),tip:+f.get("tip")||0,total:(+f.get("price")||0)+(+f.get("tip")||0),pickupNeighborhood:f.get("pickupNeighborhood"),pickupAddress:f.get("pickupAddress"),dropNeighborhood:f.get("dropNeighborhood"),dropAddress:f.get("dropAddress"),notes:f.get("notes"),status:"in_progress",createdAt:new Date().toISOString(),code:rand3()};state.services.unshift(s);user().online=false;save();toast("Servicio creado");render()}
function toggleOnline(){user().online=!user().online;save();render()}
function savePayQR(){user().paymentQr=document.getElementById("payQr").value;save();toast("QR de pago guardado")}

function startDriverGPS(){
 if(!navigator.geolocation)return;
 stopGPS();
 geoWatch=navigator.geolocation.watchPosition(pos=>{
  const d=user();d.lat=pos.coords.latitude;d.lng=pos.coords.longitude;d.accuracy=pos.coords.accuracy;d.lastGpsAt=new Date().toISOString();d.online=!!d.online;save();
 },err=>console.log("GPS",err),{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
}
function stopGPS(){if(geoWatch!==null){navigator.geolocation.clearWatch(geoWatch);geoWatch=null}}
async function enableNotifications(){
 if(!("Notification"in window))return toast("Este navegador no soporta notificaciones");
 const p=await Notification.requestPermission();if(p==="granted")toast("Notificaciones activadas");
}
function notifyNewService(s){
 if(role()==="driver"&&s.driverId===user().id){
   if(Notification.permission==="granted")new Notification("¡Nuevo servicio asignado!",{body:`${s.category} · ${money(s.total)} · ${s.pickupAddress||""}`});
   playAlert(true);
 }
}
function playAlert(loud=false){
 try{const ctx=new (window.AudioContext||window.webkitAudioContext)();const gain=ctx.createGain();gain.gain.value=loud?.55:.25;gain.connect(ctx.destination);[880,1320,1760,1320].forEach((hz,i)=>{const o=ctx.createOscillator();o.type="sine";o.frequency.value=hz;o.connect(gain);o.start(ctx.currentTime+i*.16);o.stop(ctx.currentTime+i*.16+.12)});}catch(e){}
}
setInterval(()=>{if(role()==="driver"){const s=state.services.find(x=>x.driverId===user().id&&x.status==="assigned");if(s){playAlert();notifyNewService(s)}}},12000);

async function checkDailyFace(){
 const d=user();if(!d)return;
 const day=new Date().toISOString().slice(0,10);
 if(d.lastFaceAuth===day)return;
 modal(`<h2>Verificación facial</h2><p>Por seguridad, el conductor debe autenticarse una vez al día.</p><video id="faceVideo" autoplay playsinline style="width:100%;max-height:350px;background:#111;border-radius:14px"></video><div id="faceStatus" class="muted" style="margin-top:8px">Cargando modelos…</div><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" onclick="closeModal()">Ahora no</button><button class="btn primary" id="faceBtn" onclick="verifyFace()" disabled>Verificar rostro</button></div>`);
 try{
   await Promise.all([
    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
   ]);
   faceReady=true;document.getElementById("faceStatus").textContent="Modelos listos. Permite la cámara y pulsa verificar.";document.getElementById("faceBtn").disabled=false;
   const stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});document.getElementById("faceVideo").srcObject=stream;
 }catch(e){document.getElementById("faceStatus").textContent="No se pudo iniciar la cámara/modelos: "+e.message}
}
async function verifyFace(){
 if(!faceReady)return;
 const v=document.getElementById("faceVideo"),status=document.getElementById("faceStatus");
 status.textContent="Analizando rostro…";
 try{
   const result=await faceapi.detectSingleFace(v,new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
   if(!result){status.textContent="No se detectó un rostro claro.";return}
   const desc=Array.from(result.descriptor);
   const d=user();
   // Si el conductor ya tiene descriptor, se compara. Si es su primera autenticación,
   // este flujo permite registrar el descriptor inicial como preregistro.
   if(d.faceDescriptor?.length){
     const dist=faceapi.euclideanDistance(new Float32Array(d.faceDescriptor),new Float32Array(desc));
     if(dist>.58){status.textContent="Rostro no coincide. Distancia: "+dist.toFixed(3);return}
   }else{
     d.faceDescriptor=desc;
   }
   d.lastFaceAuth=new Date().toISOString().slice(0,10);d.faceAuthAt=new Date().toISOString();save();
   status.textContent="Rostro validado correctamente.";
   setTimeout(()=>{closeModal();render()},700);
 }catch(e){status.textContent="Error de reconocimiento: "+e.message}
}

/* =========================
   QR SIN DEPENDENCIA EXTRA:
   genera un QR usando un servicio externo de imagen. Para producción se puede
   sustituir por una librería QR local.
   ========================= */
function drawQR(idv,text){const c=document.getElementById(idv);if(!c)return;const img=new Image();img.crossOrigin="anonymous";img.onload=()=>{const x=c.getContext("2d");c.width=210;c.height=210;x.drawImage(img,0,0,210,210)};img.src="https://api.qrserver.com/v1/create-qr-code/?size=420x420&data="+encodeURIComponent(text)}
