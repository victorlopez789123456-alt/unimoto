<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<title>UNIMOTO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#111827;--muted:#667085;--line:#e4e7ec;--dark:#101827;--brand:#ffd000;--ok:#17a673;--red:#d92d20;--orange:#f79009;--shadow:0 10px 30px rgba(16,24,40,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at top,#29456b,#101827 65%)}.login-card{width:min(470px,100%);background:#fff;border-radius:24px;padding:26px;box-shadow:0 30px 100px rgba(0,0,0,.3)}.brand{font-size:30px;font-weight:900}.brand b{color:#e5ad00}.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:18px 0}.roles button{border:0;padding:11px;border-radius:10px;background:#edf1f6}.roles .active{background:var(--brand)}
.field{margin:0 0 12px}.field label{display:block;font-weight:800;font-size:12px;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid #d0d5dd;background:#fff;border-radius:10px;padding:11px 12px;outline:0}textarea{min-height:80px}
.btn{border:0;padding:10px 13px;border-radius:10px;background:#e9edf2;color:var(--ink);font-weight:800}.btn.primary{background:var(--brand)}.btn.dark{background:var(--dark);color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.red{background:var(--red);color:#fff}.btn.orange{background:var(--orange);color:#fff}.btn.sm{padding:7px 9px;font-size:12px}
.app{min-height:100vh}.top{height:64px;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:20}.top .brand{font-size:21px}.top-right{display:flex;gap:8px;align-items:center}.pill{background:#223149;border-radius:999px;padding:7px 10px;font-size:12px}
.layout{display:grid;grid-template-columns:240px 1fr}.side{background:#111b2d;color:#dce5f4;min-height:calc(100vh - 64px);position:sticky;top:64px;padding:12px}.nav{display:grid;gap:6px}.nav button{background:transparent;color:inherit;text-align:left;border:0;padding:12px;border-radius:10px}.nav button:hover,.nav button.active{background:#23334c;color:#fff}.main{padding:22px;max-width:1500px;width:100%;margin:auto}
.title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:17px}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:var(--shadow)}.stat{font-size:28px;font-weight:900}.muted{color:var(--muted)}.small{font-size:12px}.tag{display:inline-flex;gap:5px;border-radius:999px;padding:5px 9px;background:#eef2f6;font-size:12px;font-weight:800}.tag.ok{color:#087a50;background:#def7ec}.tag.busy{color:#985b00;background:#fff0d5}.tag.red{color:#a51f2c;background:#ffe4e7}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.service{background:#101c30;color:#fff;border-radius:16px;padding:17px;margin:10px 0}.service.light{background:#fff;color:var(--ink);border:1px solid var(--line)}.map{height:280px;border-radius:14px;background:#e4ebf2;overflow:hidden;display:grid;place-items:center;color:#607088}.map iframe{width:100%;height:100%;border:0}
.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;white-space:nowrap}.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#e9eef4}.hr{border:0;border-top:1px solid var(--line);margin:17px 0}
.modal{position:fixed;inset:0;background:rgba(5,12,22,.7);display:grid;place-items:center;padding:18px;z-index:100}.modal-card{background:#fff;border-radius:18px;width:min(780px,100%);max-height:94vh;overflow:auto;padding:20px}.modal-card video{width:100%;border-radius:14px;background:#111}.qr{display:block;width:230px;height:230px;margin:7px auto}
.chat{display:grid;grid-template-rows:1fr auto;height:350px}.messages{padding:8px;overflow:auto;background:#f8fafc;border-radius:12px}.msg{max-width:78%;padding:9px 11px;border-radius:12px;background:#e7ecf2;margin:5px 0}.msg.me{margin-left:auto;background:#dff7ed}
#toast{position:fixed;bottom:15px;right:15px;z-index:200;display:grid;gap:8px}.toast{background:#101827;color:#fff;padding:12px 14px;border-radius:10px;box-shadow:var(--shadow)}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:fixed;top:auto;bottom:0;width:100%;min-height:auto;padding:5px;z-index:30}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.main{padding-bottom:90px}.g2,.g3,.g4{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" class="login">
 <div class="login-card">
  <div class="brand">UNI<b>MOTO</b></div>
  <div class="muted">Servicios de mototaxi, pasajeros y entregas</div>
  <div class="roles">
   <button class="active" data-role="driver">Conductor</button>
   <button data-role="client">Cliente</button>
   <button data-role="admin">Admin</button>
  </div>
  <form id="loginForm">
   <div class="field"><label id="userLabel">Usuario / celular</label><input id="loginUser" required autocomplete="username"></div>
   <div class="field"><label>Contraseña</label><input id="loginPass" type="password" inputmode="numeric" maxlength="12" required></div>
   <button class="btn primary" style="width:100%">Ingresar</button>
  </form>
  <div class="row" style="justify-content:space-between;margin-top:11px">
   <button class="btn sm" onclick="recover()">Recuperar contraseña</button>
   <button class="btn sm" onclick="registerClient()">Nuevo cliente</button>
  </div>
  
 </div>
</div>

<div id="app" class="app hidden">
<header class="top"><div class="brand">UNI<b>MOTO</b></div><div class="top-right"><span class="pill" id="rolePill"></span><span class="pill" id="userPill"></span><button class="btn sm" onclick="logout()">Salir</button></div></header>
<div class="layout"><aside class="side"><div id="nav" class="nav"></div></aside><main id="main" class="main"></main></div>
</div>
<div id="modal" class="modal hidden"><div id="modalBody" class="modal-card"></div></div>
<div id="toast"></div>

<script>
const SUPABASE_URL="https://njvzlgcsizroyzfojlus.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_xQmUN-3dtvsSCtHgajN01w_siBAIw2F";
let sb=null;
function supabaseReady(){return !!SUPABASE_PUBLISHABLE_KEY}
function createSupabase(){
  if(!supabaseReady()) return null;
  try{return supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}})}
  catch(e){console.error(e);return null}
}
sb=createSupabase();
function setupSupabase(){
  modal(`<h2>Configurar conexión Supabase</h2>
    <p class="muted">La clave anterior fue rechazada por Supabase. Pega aquí la <b>Publishable key</b> de este proyecto, normalmente empieza por <code>sb_publishable_</code>.</p>
    <div class="field"><label>Publishable key</label><input id="supabaseKeyInput" placeholder="sb_publishable_..." autocomplete="off"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveSupabaseKey()">Guardar y recargar</button></div>`);
}
function saveSupabaseKey(){
  const k=($("#supabaseKeyInput")?.value||"").trim();
  if(!k.startsWith("sb_publishable_")){toast("La Publishable key debe comenzar por sb_publishable_");return}
  localStorage.setItem("mg_supabase_key",k);
  location.reload();
}
const FACE_MODELS="https://cdn.jsdelivr.net/gh/vladmandic/face-api/model/";
let roleSel="driver",session=JSON.parse(localStorage.getItem("mg_session")||"null"),page="home",gpsWatch=null,knownServices=new Set(),alertEnabled=false;

const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=x=>new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(Number(x)||0);
const id=()=>crypto.randomUUID?.()||Math.random().toString(36).slice(2);
const rand4=()=>String(Math.floor(1000+Math.random()*9000));
const rand3=()=>String(Math.floor(100+Math.random()*900));
const $=s=>document.querySelector(s);
function toast(t){let d=document.createElement("div");d.className="toast";d.textContent=t;$("#toast").appendChild(d);setTimeout(()=>d.remove(),3500)}
function modal(h){$("#modalBody").innerHTML=h;$("#modal").classList.remove("hidden")}
function closeModal(){stopModalCamera();unsubscribeServiceLocation();$("#modal").classList.add("hidden")}
function current(){if(!session)return{};return session.record||{}}
function saveSession(r){session.record=r;localStorage.setItem("mg_session",JSON.stringify(session))}
function logout(){stopGPS();localStorage.removeItem("mg_session");location.reload()}
function nav(p){page=p;buildNav();render()}

document.querySelectorAll(".roles button").forEach(b=>b.onclick=()=>{roleSel=b.dataset.role;document.querySelectorAll(".roles button").forEach(x=>x.classList.toggle("active",x===b));$("#userLabel").textContent=roleSel==="client"?"Documento o correo":roleSel==="admin"?"Usuario admin":"Usuario / celular"});

$("#loginForm").onsubmit=async e=>{
 e.preventDefault();
 const u=$("#loginUser").value.trim(),p=$("#loginPass").value.trim(); if(roleSel!=="admin"&&!/^\d{4}$/.test(p)){toast("La contraseña de conductor/cliente debe tener 4 dígitos");return}
 let q;
 if(roleSel==="admin")q=await sb.from("profiles").select("*").eq("role","admin").eq("username",u).eq("password_4",p).eq("active",true).maybeSingle();
 if(roleSel==="driver")q=await sb.from("profiles").select("*,drivers(*)").eq("role","driver").eq("active",true).or(`username.eq.${u},phone.eq.${u}`).eq("password_4",p).maybeSingle();
 if(roleSel==="client")q=await sb.from("profiles").select("*,clients(*)").eq("role","client").eq("active",true).or(`document_number.eq.${u},email.eq.${u}`).eq("password_4",p).maybeSingle();
 if(q.error){toast(q.error.message);return}
 if(!q.data){toast("Usuario o contraseña incorrectos");return}
 let rec=q.data;
 if(roleSel==="driver")rec={...rec,...(rec.drivers||{})};
 if(roleSel==="client")rec={...rec,...(rec.clients||{})};
 session={role:roleSel,id:rec.id,record:rec};localStorage.setItem("mg_session",JSON.stringify(session));
 openApp();
};

function openApp(){$("#login").classList.add("hidden");$("#app").classList.remove("hidden");$("#rolePill").textContent=session.role;$("#userPill").textContent=current().full_name||"Usuario";buildNav();render();if(session.role==="driver"){startGPS();checkFaceDaily();subscribeRealtime();}else subscribeRealtime()}
function buildNav(){
 const arr=session.role==="admin"
 ?[["dashboard","Dashboard"],["drivers","Conductores"],["clients","Clientes"],["servicesAdmin","Servicios"],["faresAdmin","Tarifas"],["chats","Chats"]]
 :[["home","Inicio"],["services","Servicios"],["fares","Tarifas"],["chat","Chat admin"],["profile","Perfil"],["history","Historial"]];
 $("#nav").innerHTML=arr.map(([p,t])=>`<button class="${page===p?"active":""}" onclick="nav('${p}')">${t}</button>`).join("");
}
async function render(){if(session.role==="admin")return renderAdmin();if(session.role==="driver")return renderDriver();return renderClient()}

/* ========================= DRIVER ========================= */
async function renderDriver(){
 const d=current(),m=$("#main");
 if(page==="home"){
  const [{data:all},{data:mine}]=await Promise.all([
    sb.from("services").select("*").in("status",["pending","assigned","accepted","in_progress"]).order("created_at",{ascending:false}),
    sb.from("services").select("*").eq("driver_id",d.id).in("status",["assigned","accepted","in_progress"]).order("created_at",{ascending:false})
  ]);
  const services=[...(mine||[]),...(all||[]).filter(s=>s.status==="pending"&&!s.driver_id)].filter((s,i,a)=>a.findIndex(x=>x.id===s.id)===i);
  m.innerHTML=`<div class="title"><div><h1>Hola, ${esc(d.full_name)}</h1><div class="muted">Panel de conductor</div></div><div class="row"><button class="btn" onclick="enableAlerts()">🔔 ${alertEnabled?"Alertas activas":"Activar alertas"}</button><button class="btn ${d.online?"ok":"dark"}" onclick="setOnline(${!d.online})">${d.online?"● ACTIVO":"○ INACTIVO"}</button></div></div>
  <div class="grid g4"><div class="card"><div class="muted small">Estado</div><div class="stat">${d.online?"Activo":"Inactivo"}</div></div><div class="card"><div class="muted small">Servicios en curso</div><div class="stat">${mine?.length||0}</div></div><div class="card"><div class="muted small">Realizados</div><div class="stat">${(await countDriverCompleted(d.id))}</div></div><div class="card"><div class="muted small">GPS</div><div class="stat">${d.latitude?"OK":"—"}</div></div></div>
  <div class="card" style="margin-top:16px"><div class="title"><h2>Servicio individual</h2></div><form onsubmit="driverCreateService(event)" class="grid g3">
   <div class="field"><label>Categoría</label><select name="category" id="driverCat">${await categoryOptions()}</select></div>
   <div class="field"><label>Cliente / restaurante</label><input name="customer" required></div><div class="field"><label>Precio</label><input name="price" type="number" min="0" required></div>
   <div class="field"><label>Barrio recogida</label><input name="pickup_neighborhood" required></div><div class="field"><label>Dirección recogida</label><input name="pickup_address" required></div>
   <div class="field"><label>Barrio llegada</label><input name="dropoff_neighborhood"></div><div class="field"><label>Dirección llegada</label><input name="dropoff_address"></div>
   <div class="field"><label>Propina</label><input name="tip" type="number" min="0" value="0"></div><div class="field"><label>Notas / parámetros</label><input name="notes"></div>
   <div><button class="btn primary">Crear servicio</button></div></form></div>
  <div class="card" style="margin-top:16px"><h2>Disponibles / asignados</h2>${services.length?services.map(driverServiceCard).join(""):"<div class='muted'>No hay servicios.</div>"}</div>`;
  return;
 }
 if(page==="services"){
  const {data}=await sb.from("services").select("*").eq("driver_id",d.id).in("status",["assigned","accepted","in_progress"]).order("created_at",{ascending:false});
  const available=d.online?(await sb.from("services").select("*").eq("status","pending").is("driver_id",null).order("created_at",{ascending:false})).data||[]:[];
  m.innerHTML=`<div class="title"><h1>Servicios</h1></div>${[...(data||[]),...available].map(driverServiceCard).join("")||"<div class='card muted'>No hay servicios.</div>"}`;
  return;
 }
 if(page==="fares"){m.innerHTML=`<div class="title"><h1>Tarifas</h1></div><div class="card"><input placeholder="Filtrar por barrio..." oninput="fareFilter(this.value)"><div id="fareList">${await fareRows()}</div></div>`;return}
 if(page==="profile"){
  const {data:p}=await sb.from("profiles").select("*").eq("id",d.id).single();saveSession({...d,...p});
  const {data:drv}=await sb.from("drivers").select("face_descriptor").eq("id",d.id).maybeSingle();
  const hasFace=!!drv?.face_descriptor?.length;
  m.innerHTML=`<div class="title"><h1>Mi perfil</h1></div><div class="grid g2"><div class="card"><h2>${esc(p.full_name)}</h2><div class="grid g2">${["phone","document_number","plate","model","bike_type"].map(k=>`<div><span class="muted small">${esc(k)}</span><br><b>${esc(p[k]||d[k]||"—")}</b></div>`).join("")}</div><hr class="hr"><label>QR para recibir pagos</label><input id="paymentQr" value="${esc(p.payment_qr_url||"")}" placeholder="URL o referencia del QR"><button class="btn primary" style="margin-top:8px" onclick="savePaymentQR()">Guardar</button></div>
  <div class="card"><h2>QR de identificación</h2><img id="driverQrImage" class="qr" alt="QR del conductor"><div class="small muted" style="text-align:center">Código alterno: <b>${esc(p.profile_code||"")}</b></div></div>
  <div class="card"><h2>Reconocimiento facial</h2><p class="muted small">${hasFace?"Ya tienes un rostro registrado. Puedes actualizarlo si cambia tu apariencia (lentes, barba, etc.).":"Aún no has registrado tu rostro. Es necesario para la verificación diaria."}</p><button class="btn primary" onclick="registerFace('${d.id}')">${hasFace?"Actualizar mi rostro":"Registrar mi rostro"}</button></div></div>`;
  renderDriverQr(d.id,p.profile_code);return;
 }
 if(page==="history"){
  const {data}=await sb.from("services").select("*").eq("driver_id",d.id).eq("status","completed").order("completed_at",{ascending:false});
  m.innerHTML=`<div class="title"><h1>Historial</h1></div><div class="card tablewrap"><table class="table"><tr><th>Fecha</th><th>Categoría</th><th>Cliente</th><th>Total</th><th>Pago</th></tr>${(data||[]).map(s=>`<tr><td>${new Date(s.completed_at).toLocaleString()}</td><td>${esc(s.category)}</td><td>${esc(s.customer_name||"")}</td><td>${money(s.total)}</td><td>${esc(s.payment_method||"—")}</td></tr>`).join("")||"<tr><td colspan='5'>Sin registros</td></tr>"}</table></div>`;return}
 if(page==="chat"){const thread=await getAdminThread(d.id,"driver");m.innerHTML=chatHTML(thread);bindChat(thread);return}
}
async function countDriverCompleted(idv){const q=await sb.from("services").select("*",{count:"exact",head:true}).eq("driver_id",idv).eq("status","completed");return q.count||0}
function driverServiceCard(s){
 return `<div class="service ${s.status==="in_progress"?"light":""}"><div class="title"><div><span class="tag">${esc(s.category)}</span><h3>${esc(s.customer_name||"Servicio")}</h3><div>${esc(s.pickup_neighborhood||"")} · ${esc(s.pickup_address||"")} → ${esc(s.dropoff_address||"")}</div></div><b>${money(s.total)}</b></div>
 <div class="row"><span>Estado: <b>${esc(s.status)}</b></span><span>Propina: ${money(s.tip)}</span>${s.driver_verification_code&&!s.driver_verified?`<span class="tag ok">Código secreto para el cliente: ${esc(s.driver_verification_code)}</span>`:""}${s.driver_verified?"<span class='tag ok'>Cliente verificado</span>":""}</div>
 <div class="row" style="justify-content:flex-end;margin-top:10px">${s.status==="pending"?`<button class="btn primary" onclick="acceptService('${s.id}')">Aceptar</button>`:""}${s.status==="assigned"&&s.driver_id===current().id?`<button class="btn primary" onclick="acceptAssigned('${s.id}')">Aceptar</button>`:""}<button class="btn" onclick="serviceDetail('${s.id}')">Ver servicio / chat</button></div></div>`;
}
async function acceptService(sid){const d=current();const q=await sb.from("services").update({driver_id:d.id,status:"accepted"}).eq("id",sid).eq("status","pending");if(q.error){toast(q.error.message);return}toast("Servicio aceptado");playAlert();render()}
async function acceptAssigned(sid){const d=current();const q=await sb.from("services").update({status:"accepted"}).eq("id",sid).eq("driver_id",d.id).eq("status","assigned");if(q.error){toast(q.error.message);return}toast("Servicio aceptado");playAlert();render()}
async function setOnline(on){const d=current();const status=on?"available":"offline";const q=await sb.from("drivers").update({online:on,status}).eq("id",d.id);if(q.error)toast(q.error.message);else{saveSession({...d,online:on,status});render()}}
async function driverCreateService(e){e.preventDefault();const f=new FormData(e.target),cat=f.get("category"),price=+f.get("price"),tip=+f.get("tip")||0;const d=current();const payload={driver_id:d.id,category:cat,customer_name:f.get("customer"),pickup_neighborhood:f.get("pickup_neighborhood"),pickup_address:f.get("pickup_address"),dropoff_neighborhood:f.get("dropoff_neighborhood"),dropoff_address:f.get("dropoff_address"),price,tip,notes:f.get("notes"),status:"in_progress",accepted_at:new Date().toISOString(),started_at:new Date().toISOString()};const q=await sb.from("services").insert(payload).select().single();if(q.error)toast(q.error.message);else{await sb.from("drivers").update({online:false,status:"busy",busy:true}).eq("id",d.id);toast("Servicio creado");render()}}
async function savePaymentQR(){const d=current(),url=$("#paymentQr").value.trim();const q=await sb.from("profiles").update({payment_qr_url:url}).eq("id",d.id);if(q.error)toast(q.error.message);else{saveSession({...d,payment_qr_url:url});toast("QR guardado")}}
async function categoryOptions(){if(!sb)return "<option>Configura Supabase</option>";const {data}=await sb.from("categories").select("id,name").eq("active",true).order("name");return (data||[]).map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join("")}
function renderDriverQr(driverId,profileCode){const img=$("#driverQrImage");if(!img)return;const qrData=JSON.stringify({type:"motorigo-driver",id:driverId,code:profileCode||""});QRCode.toDataURL(qrData,{width:300,margin:2},(err,url)=>{if(err){console.error("QR error:",err);toast("No se pudo generar el QR");return}img.src=url});}

/* ========================= CLIENT ========================= */
async function renderClient(){
 const c=current(),m=$("#main");
 if(page==="home"){
  const {data}=await sb.from("services").select("*").eq("client_id",c.id).in("status",["pending","assigned","accepted","in_progress"]).order("created_at",{ascending:false}).limit(1);
  m.innerHTML=`<div class="title"><div><h1>Hola, ${esc(c.full_name)}</h1><div class="muted">Solicita tu servicio.</div></div><button class="btn primary" onclick="nav('newService')">+ Nuevo servicio</button></div><div class="grid g3"><div class="card"><div class="muted small">Servicios</div><div class="stat">${await clientCount(c.id)}</div></div><div class="card"><div class="muted small">En curso</div><div class="stat">${data?.length||0}</div></div><div class="card"><div class="muted small">Código de cliente</div><div class="stat">${esc(c.profile_code||"")}</div></div></div>${data?.[0]?`<div class="card" style="margin-top:16px"><h2>Servicio actual</h2>${await clientServiceCard(data[0])}</div>`:"<div class='card' style='margin-top:16px'><h2>¿Qué necesitas?</h2><div class='muted'>Crea un servicio de personas, documentos o restaurante.</div></div>"}`;return
 }
 if(page==="newService"){m.innerHTML=`<div class="title"><h1>Nuevo servicio</h1></div><div class="card"><form onsubmit="createClientService(event)" class="grid g2">

async function importCSV(){
 const file=$("#csvFile").files[0];
 if(!file)return toast("Selecciona un CSV");
 const lines=(await file.text()).split(/\r?\n/).filter(Boolean);
 if(!lines.length)return toast("CSV vacío");
 const headers=lines.shift().split(",").map(x=>x.trim().toLowerCase());
 const rows=[];
 for(const line of lines){
   const a=line.split(",");
   const o={}; headers.forEach((h,i)=>o[h]=(a[i]||"").trim());
   if(o.barrio&&o.categoria&&o.valor){
     rows.push({neighborhood:o.barrio,category:o.categoria,price:Number(o.valor),active:true});
   }
 }
 if(!rows.length)return toast("No se encontraron filas válidas. Usa barrio,categoria,valor");
 const q=await sb.from("fares").upsert(rows,{onConflict:"neighborhood,category"});
 if(q.error)toast(q.error.message);else toast(`${rows.length} tarifas importadas`);
 render();
}

/* ========================= COMMON SERVICE ========================= */
let trackingChannel=null,trackingLastUpdate=null,trackingClientCoords=null,trackingTimerId=null;
function haversineKm(lat1,lon1,lat2,lon2){const R=6371,toRad=x=>x*Math.PI/180;const dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1);const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}
function unsubscribeServiceLocation(){if(trackingChannel){sb.removeChannel(trackingChannel);trackingChannel=null}if(trackingTimerId){clearInterval(trackingTimerId);trackingTimerId=null}}
function updateTrackingMap(lat,lon){const box=$("#trackingMap");if(!box)return;box.innerHTML=`<iframe src="https://www.openstreetmap.org/export/embed.html?bbox=${lon-.01}%2C${lat-.01}%2C${lon+.01}%2C${lat+.01}&layer=mapnik&marker=${lat}%2C${lon}"></iframe>`;trackingLastUpdate=Date.now();updateTrackingInfo(lat,lon)}
function updateTrackingInfo(lat,lon){const info=$("#trackingInfo");if(!info)return;const secs=trackingLastUpdate?Math.max(0,Math.round((Date.now()-trackingLastUpdate)/1000)):null;const distTxt=(trackingClientCoords&&lat!=null)?`Conductor a ${haversineKm(trackingClientCoords.lat,trackingClientCoords.lon,lat,lon).toFixed(2)} km`:"";info.textContent=[distTxt,secs!==null?`Actualizado hace ${secs}s`:""].filter(Boolean).join(" · ")}
function subscribeServiceLocation(sid,clientLat,clientLon){unsubscribeServiceLocation();if(clientLat!=null&&clientLon!=null)trackingClientCoords={lat:clientLat,lon:clientLon};trackingChannel=sb.channel(`service-location-${sid}`).on("postgres_changes",{event:"INSERT",schema:"public",table:"service_locations",filter:`service_id=eq.${sid}`},payload=>{updateTrackingMap(payload.new.latitude,payload.new.longitude)}).subscribe();trackingTimerId=setInterval(()=>updateTrackingInfo(),3000)}
async function serviceDetail(sid){
 const {data:s}=await sb.from("services").select("*").eq("id",sid).single();if(!s)return toast("Servicio no encontrado");
 const d=s.driver_id?(await sb.from("profiles").select("*,drivers(*)").eq("id",s.driver_id).single()).data:null;
 const thread=await ensureServiceThread(sid,s.client_id,s.driver_id,null);
 const dv=d?{...d,...(d.drivers||{})}:null;
 const codeLine=session.role==="driver"&&s.driver_verification_code&&!s.driver_verified?`<p><b>Código secreto para el cliente:</b> <span class="stat">${esc(s.driver_verification_code)}</span></p>`:"";
 modal(`<div class="title"><div><span class="tag">${esc(s.category)}</span><h2>${esc(s.customer_name||"Servicio")}</h2></div><button class="btn" onclick="closeModal()">Cerrar</button></div>
 <div class="grid g2"><div><p><b>Recogida:</b> ${esc(s.pickup_address||"")}</p><p><b>Destino:</b> ${esc(s.dropoff_address||"")}</p><p><b>Total:</b> ${money(s.total)}</p><p><b>Propina:</b> ${money(s.tip)}</p><p><b>Estado:</b> ${esc(s.status)}</p>${dv?`<p><b>Conductor:</b> ${esc(dv.full_name)} · ${esc(dv.model||"")} ${esc(dv.plate||"")}</p>`:""}${codeLine}${session.role==="client"&&s.driver_id&&!s.driver_verified?`<button class="btn primary" onclick="openVerifyDriver('${s.id}')">Verificar conductor</button>`:""}</div><div><div class="map" id="trackingMap">${dv?.latitude?`<iframe src="https://www.openstreetmap.org/export/embed.html?bbox=${dv.longitude-.01}%2C${dv.latitude-.01}%2C${dv.longitude+.01}%2C${dv.latitude+.01}&layer=mapnik&marker=${dv.latitude}%2C${dv.longitude}"></iframe>`:"GPS no disponible"}</div><div id="trackingInfo" class="small muted" style="text-align:center;margin-top:6px"></div></div></div><hr class="hr"><h3>Chat privado</h3>${chatHTML(thread)}<div id="serviceActions"></div>`);
 bindChat(thread);renderServiceActions(s);
 if(["accepted","in_progress"].includes(s.status)){
  const clientPos=session.role==="client"?await getCurrentPosition():null;
  subscribeServiceLocation(sid,clientPos?.coords.latitude,clientPos?.coords.longitude);
 }
}
async function renderServiceActions(s){const box=$("#serviceActions");if(!box)return;if(session.role==="driver"&&s.driver_id===session.id&&["accepted","in_progress"].includes(s.status))box.innerHTML=`<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn red" onclick="finish('${s.id}',false)">Terminar servicio</button><button class="btn ok" onclick="finish('${s.id}',true)">Terminar y confirmar pago</button></div>`;if(session.role==="driver"&&s.category==="restaurante"&&s.driver_id===session.id)box.innerHTML+=`<div class="field" style="margin-top:10px"><label>Foto de entrega</label><input id="deliveryFile" type="file" accept="image/*"><button class="btn" onclick="deliveryUpload('${s.id}')">Adjuntar entrega</button></div>`}
async function finish(sid,withPayment){if(withPayment){modal(`<h2>Confirmar servicio</h2><p>No genera ningún cobro automático.</p><div class="row">${["cash","nequi","daviplata","transfer","other"].map(x=>`<button class="btn primary" onclick="complete('${sid}','${x}')">${x}</button>`).join("")}</div>`)}else complete(sid,"not_charged")}
async function complete(sid,payment){const q=await sb.from("services").update({status:"completed",payment_method:payment,payment_confirmed:true}).eq("id",sid);if(q.error){toast(q.error.message);return}if(session.role==="driver")await sb.from("drivers").update({busy:false,online:true,status:"available"}).eq("id",session.id);closeModal();toast("Servicio terminado");render()}
async function deliveryUpload(sid){const file=$("#deliveryFile").files[0];if(!file)return toast("Selecciona una foto");const url=await upload("delivery-photos",`${sid}/${Date.now()}-${file.name}`,file);const q=await sb.from("services").update({delivery_photo_url:url,delivery_photo_uploaded_at:new Date().toISOString()}).eq("id",sid);if(q.error)toast(q.error.message);else toast("Foto de entrega guardada")}
async function fareRows(){if(!sb)return "<div class='muted'>Configura Supabase primero.</div>";const {data}=await sb.from("fares").select("*").eq("active",true).order("neighborhood");return (data||[]).map(f=>`<div class="row" style="justify-content:space-between;padding:9px;border-bottom:1px solid var(--line)"><span><b>${esc(f.neighborhood)}</b> · ${esc(f.category)}</span><b>${money(f.price)}</b></div>`).join("")||"<div class='muted'>Sin tarifas.</div>"}
async function fareFilter(q){const {data}=await sb.from("fares").select("*").eq("active",true).ilike("neighborhood",`%${q}%`).order("neighborhood");$("#fareList").innerHTML=(data||[]).map(f=>`<div class="row" style="justify-content:space-between;padding:9px;border-bottom:1px solid var(--line)"><span><b>${esc(f.neighborhood)}</b> · ${esc(f.category)}</span><b>${money(f.price)}</b></div>`).join("")}

/* ========================= CHAT ========================= */
async function getAdminThread(subjectId,type){let q=await sb.from("chat_threads").select("*").eq("thread_type",type+"_admin").eq(type==="driver"?"driver_id":"client_id",subjectId).maybeSingle();if(q.data)return q.data;const payload={thread_type:type+"_admin",admin_id:(await sb.from("profiles").select("id").eq("role","admin").limit(1).single()).data.id};payload[type==="driver"?"driver_id":"client_id"]=subjectId;return (await sb.from("chat_threads").insert(payload).select().single()).data}
async function ensureServiceThread(sid,cid,did,adminid){let q=await sb.from("chat_threads").select("*").eq("service_id",sid).eq("thread_type","service").maybeSingle();if(q.data)return q.data;return (await sb.from("chat_threads").insert({service_id:sid,thread_type:"service",client_id:cid,driver_id:did,admin_id:adminid}).select().single()).data}
function chatHTML(t){return `<div class="chat"><div id="msgs" class="messages"></div><form id="chatForm" class="row"><input name="message" placeholder="Escribe un mensaje…" required><input name="attachment" type="file" accept="image/*" style="max-width:180px"><button class="btn primary">Enviar</button></form></div>`}
async function bindChat(t){if(!t)return;await refreshMessages(t.id);$("#chatForm")?.addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.target),message=f.get("message"),file=f.get("attachment");let url=null;if(file?.size)url=await upload("chat-attachments",`${t.id}/${Date.now()}-${file.name}`,file);const q=await sb.from("chat_messages").insert({thread_id:t.id,sender_id:session.id,message,attachment_url:url,attachment_type:file?.type||null});if(q.error)toast(q.error.message);else{e.target.reset();refreshMessages(t.id)}})}
async function refreshMessages(tid){const {data}=await sb.from("chat_messages").select("*").eq("thread_id",tid).order("created_at");const box=$("#msgs");if(box)box.innerHTML=(data||[]).map(x=>`<div class="msg ${x.sender_id===session.id?"me":""}">${esc(x.message||"")}${x.attachment_url?`<br><a href="${esc(x.attachment_url)}" target="_blank">Adjunto</a>`:""}</div>`).join("")}
async function makeNotification(uid,sid,title,body){return sb.from("notifications").insert({user_id:uid,service_id:sid,title,body,type:"service"})}

/* ========================= GPS / REALTIME / ALERTAS ========================= */
function startGPS(){stopGPS();if(!navigator.geolocation)return;gpsWatch=navigator.geolocation.watchPosition(async p=>{const d=current();const upd={latitude:p.coords.latitude,longitude:p.coords.longitude,gps_accuracy:p.coords.accuracy,gps_updated_at:new Date().toISOString()};await sb.from("drivers").update(upd).eq("id",d.id);saveSession({...d,...upd});const {data:sv}=await sb.from("services").select("id").eq("driver_id",d.id).in("status",["accepted","in_progress"]).limit(1);if(sv?.[0])await sb.from("service_locations").insert({service_id:sv[0].id,driver_id:d.id,latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy});},e=>console.log("GPS",e),{enableHighAccuracy:true,maximumAge:3000,timeout:15000})}
function stopGPS(){if(gpsWatch!==null){navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null}}
async function enableAlerts(){if(!("Notification"in window))return toast("El navegador no soporta notificaciones");const p=await Notification.requestPermission();if(p==="granted"){alertEnabled=true;playAlert();toast("Alertas activadas")}else toast("Debes permitir notificaciones")}
function playAlert(){try{const C=new (window.AudioContext||window.webkitAudioContext)(),g=C.createGain();g.gain.value=.65;g.connect(C.destination);[1200,1800,2400,1800].forEach((hz,i)=>{const o=C.createOscillator();o.type="sine";o.frequency.value=hz;o.connect(g);o.start(C.currentTime+i*.13);o.stop(C.currentTime+i*.13+.10)})}catch{}}
function subscribeRealtime(){sb.channel("motorigo-live").on("postgres_changes",{event:"INSERT",schema:"public",table:"notifications"},p=>{if(p.new.user_id===session.id){if(Notification.permission==="granted")new Notification(p.new.title,{body:p.new.body||""});playAlert();toast(p.new.title);render()}}).on("postgres_changes",{event:"*",schema:"public",table:"services"},p=>{if(p.new?.driver_id===session.id||p.new?.client_id===session.id||session.role==="admin")render()}).subscribe()}
async function pollAssigned(){if(session?.role!=="driver")return;const {data}=await sb.from("services").select("*").eq("driver_id",session.id).eq("status","assigned");for(const s of data||[]){if(!knownServices.has(s.id)){knownServices.add(s.id);if(Notification.permission==="granted")new Notification("¡Nuevo servicio asignado!",{body:`${s.category} · ${money(s.total)}`});playAlert()}}}
setInterval(pollAssigned,5000);
function startPendingTimer(idv){let end=Date.now()+300000;const t=setInterval(async()=>{if(Date.now()>end)return clearInterval(t);const {data}=await sb.from("services").select("status,driver_id").eq("id",idv).single();if(data?.driver_id){clearInterval(t);toast("Un conductor aceptó tu servicio");}} ,4000)}

/* ========================= FACE API ========================= */
let cameraStream=null;
function stopModalCamera(){if(cameraStream){cameraStream.getTracks().forEach(x=>x.stop());cameraStream=null}}
async function loadFaceModels(){await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODELS),faceapi.nets.faceLandmark68Net.loadFromUri(FACE_MODELS),faceapi.nets.faceRecognitionNet.loadFromUri(FACE_MODELS)])}
async function checkFaceDaily(){const d=current();if(!d.approved){toast("Tu cuenta aún no ha sido aprobada por el administrador.");return}const day=new Date().toISOString().slice(0,10);if(d.last_face_auth_at?.slice(0,10)===day)return;modal(`<h2>Autenticación facial diaria</h2><p>Debes verificar tu rostro una vez al día antes de operar.</p><video id="faceVideo" autoplay playsinline></video><div id="faceMsg" class="muted">Cargando modelos…</div><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cerrar</button><button class="btn primary" id="faceVerify" disabled onclick="verifyFace()">Verificar</button></div>`);try{await loadFaceModels();cameraStream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});$("#faceVideo").srcObject=cameraStream;$("#faceMsg").textContent="Cámara lista.";$("#faceVerify").disabled=false}catch(e){$("#faceMsg").textContent="No se pudo iniciar: "+e.message}}
async function verifyFace(){const d=current(),v=$("#faceVideo");try{const r=await faceapi.detectSingleFace(v,new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();if(!r){$("#faceMsg").textContent="No se detectó un rostro.";return}const desc=Array.from(r.descriptor);let distance=null;if(d.face_descriptor?.length){distance=faceapi.euclideanDistance(new Float32Array(d.face_descriptor),new Float32Array(desc));if(distance>.58){await sb.from("face_auth_logs").insert({driver_id:d.id,success:false,distance,device_info:navigator.userAgent});$("#faceMsg").textContent=`Rostro no coincide (${distance.toFixed(3)}).`;return}}else{$("#faceMsg").textContent="No existe preregistro facial. Solicita al administrador que registre tu rostro.";return}const now=new Date().toISOString();await sb.from("drivers").update({last_face_auth_at:now}).eq("id",d.id);await sb.from("face_auth_logs").insert({driver_id:d.id,success:true,distance,device_info:navigator.userAgent});saveSession({...d,last_face_auth_at:now});$("#faceMsg").textContent="Rostro validado.";setTimeout(closeModal,700)}catch(e){$("#faceMsg").textContent=e.message}}
function registerFace(idv){
 modal(`<h2>Preregistro facial</h2>
 <p class="muted">Puedes usar la cámara en vivo o precargar una foto (subida o tomada con la cámara del dispositivo).</p>
 <div class="row" style="margin-bottom:10px"><button class="btn" id="regTabCam" onclick="regSwitchTab('cam','${idv}')">📷 Usar cámara en vivo</button><button class="btn" id="regTabFile" onclick="regSwitchTab('file','${idv}')">🖼️ Subir / tomar foto</button></div>
 <div id="regTabBody"></div>
 <div id="regMsg" class="muted">Cargando…</div>
 <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" onclick="closeModal()">Cerrar</button></div>`);
 regSwitchTab('cam',idv);
}
async function regSwitchTab(mode,idv){
 stopModalCamera();
 const body=$("#regTabBody");if(!body)return;
 if(mode==="cam"){
  body.innerHTML=`<video id="regFaceVideo" autoplay playsinline></video><div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn primary" id="regBtn" disabled onclick="captureFace('${idv}')">Registrar rostro</button></div>`;
  try{await loadFaceModels();cameraStream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});$("#regFaceVideo").srcObject=cameraStream;$("#regBtn").disabled=false;$("#regMsg").textContent="Cámara lista."}catch(e){$("#regMsg").textContent=e.message}
 }else{
  body.innerHTML=`<div class="field"><label>Foto del rostro</label><input id="regFaceFile" type="file" accept="image/*" capture="user"></div><img id="regFacePreview" style="max-width:100%;border-radius:14px;display:none"><div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn primary" id="regBtnFile" disabled onclick="captureFaceFromFile('${idv}')">Registrar rostro</button></div>`;
  try{await loadFaceModels();$("#regMsg").textContent="Selecciona una foto de tu galería o tómala con la cámara."}catch(e){$("#regMsg").textContent=e.message}
  $("#regFaceFile").addEventListener("change",e=>{
   const file=e.target.files[0];if(!file)return;
   const img=$("#regFacePreview");img.onload=()=>{$("#regBtnFile").disabled=false;$("#regMsg").textContent="Foto cargada."};img.src=URL.createObjectURL(file);img.style.display="block";
  });
 }
}
async function captureFace(idv){const v=$("#regFaceVideo");const r=await faceapi.detectSingleFace(v,new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();if(!r)return $("#regMsg").textContent="No se detectó rostro.";const q=await sb.from("drivers").update({face_descriptor:Array.from(r.descriptor)}).eq("id",idv);if(q.error)$("#regMsg").textContent=q.error.message;else{toast("Preregistro facial guardado");closeModal()}}
async function captureFaceFromFile(idv){const img=$("#regFacePreview");if(!img||!img.src)return;const r=await faceapi.detectSingleFace(img,new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();if(!r)return $("#regMsg").textContent="No se detectó un rostro en la foto. Intenta con otra imagen, con buena luz y de frente.";const q=await sb.from("drivers").update({face_descriptor:Array.from(r.descriptor)}).eq("id",idv);if(q.error)$("#regMsg").textContent=q.error.message;else{toast("Preregistro facial guardado");closeModal();render()}}

/* ========================= UTILIDADES ========================= */
async function upload(bucket,path,file){const q=await sb.storage.from(bucket).upload(path,file,{upsert:true});if(q.error){toast(q.error.message);return null}const {data}=sb.storage.from(bucket).getPublicUrl(path);return data?.publicUrl||null}
function profileForSession(){return current()}
async function recover(){modal(`<h2>Recuperar contraseña</h2><div class="field"><label>Cédula / correo / celular</label><input id="recoverInput"></div><button class="btn primary" onclick="doRecover()">Consultar</button><p class="small muted">Esta función muestra el PIN de 4 dígitos por el requisito del prototipo. En producción debe migrarse a un flujo seguro de recuperación.</p>`)}
async function doRecover(){const v=$("#recoverInput").value.trim();const q=await sb.from("profiles").select("password_4,full_name,role").or(`document_number.eq.${v},email.eq.${v},phone.eq.${v}`).limit(1).maybeSingle();if(q.data)modal(`<h2>Contraseña encontrada</h2><p>${esc(q.data.full_name)}</p><div class="stat" style="text-align:center">${esc(q.data.password_4)}</div><button class="btn primary" onclick="navigator.clipboard?.writeText('${q.data.password_4}');closeModal()">Copiar y cerrar</button>`);else toast("No se encontró el usuario")}
function registerClient(){modal(`<h2>Nuevo cliente</h2><form onsubmit="saveClient(event)" class="grid g2"><div class="field"><label>Nombre</label><input name="name" required></div><div class="field"><label>Documento</label><input name="document"></div><div class="field"><label>Correo</label><input name="email" type="email"></div><div class="field"><label>Celular</label><input name="phone"></div><button class="btn primary">Crear usuario</button></form>`)}
async function saveClient(e){e.preventDefault();const f=new FormData(e.target),idv=id(),pass=rand4();if(!f.get("document")&&!f.get("email"))return toast("Documento o correo requerido");const p={id:idv,role:"client",full_name:f.get("name"),document_number:f.get("document")||null,email:f.get("email")||null,phone:f.get("phone")||null,password_4:pass,profile_code:rand3()};let q=await sb.from("profiles").insert(p);if(q.error)return toast(q.error.message);q=await sb.from("clients").insert({id:idv});if(q.error)return toast(q.error.message);modal(`<h2>Usuario creado</h2><p>Tu contraseña de 4 dígitos:</p><div class="stat" style="text-align:center">${pass}</div><button class="btn primary" onclick="navigator.clipboard?.writeText('${pass}');closeModal()">Copiar y cerrar</button>`)}
async function start(){
 if(!sb){
   $("#login").classList.remove("hidden");
   const box=document.querySelector(".login-card");
   if(box && !document.getElementById("supabaseSetupBtn")){
     const b=document.createElement("button");
     b.id="supabaseSetupBtn"; b.className="btn"; b.style.width="100%"; b.style.marginTop="12px";
     b.textContent="✅ Supabase configurado"; b.disabled=true;
     box.appendChild(b);
   }
   return;
 }
 if(session){const q=await sb.from("profiles").select("*,drivers(*),clients(*)").eq("id",session.id).single();if(q.data){let r=q.data;if(session.role==="driver")r={...r,...(r.drivers||{})};if(session.role==="client")r={...r,...(r.clients||{})};session.record=r;localStorage.setItem("mg_session",JSON.stringify(session));openApp();return}}$("#login").classList.remove("hidden")}
start();
</script>
